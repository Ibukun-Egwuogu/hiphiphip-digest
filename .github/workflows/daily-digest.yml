name: HipHipHip daily digest

on:
  schedule:
    # 07:00 UTC = 08:00 Africa/Lagos, every day.
    # GitHub cron is UTC only and can be delayed a few minutes under load.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab to test

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post daily digest
        run: python post_digest.py --window 24h
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
